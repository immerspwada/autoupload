# ═══════════════════════════════════════════════════════════════
# Fly.io Configuration — YouTube Auto Uploader (24/7 Autonomous)
# ═══════════════════════════════════════════════════════════════
app = "autoupload"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  TZ = "Asia/Bangkok"
  HOST = "0.0.0.0"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health/live"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
  cpus = 1

[mounts]
  source = "autoupload_data"
  destination = "/app/persist"
